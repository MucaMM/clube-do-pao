<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta — Clube do Pão</title><style>
:root{--cream:#fffaf3;--brown:#63290f;--orange:#f5a51c;--ink:#21170f;--muted:#6f6259;--line:#ead7c1}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf3,#fff);font-family:Arial,sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:28px 20px 60px}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.logos{display:flex;align-items:center;gap:18px}.logos img{height:82px;width:82px;object-fit:contain}.logos .mineira{height:76px;width:auto;max-width:190px}.back{color:var(--brown);font-weight:700;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 25px rgba(72,35,10,.07);margin-bottom:20px}.hero{background:linear-gradient(100deg,var(--brown),#8b3e17);color:#fff;border-radius:16px;padding:22px;margin-bottom:22px}.hero h1{margin:0 0 5px}.hint{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:13px;font-weight:700;color:var(--brown);margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}.btn{border:0;background:var(--orange);color:#fff;font-weight:800;border-radius:10px;padding:13px 18px;cursor:pointer}.secondary{background:#f4eadf;color:var(--brown)}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}.tabs button.active{background:var(--brown);color:#fff}.hidden{display:none}.status{padding:9px 12px;border-radius:20px;background:#f4eadf;display:inline-block;font-size:12px}.delivery{border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;background:#fffaf3}.delivery strong{color:var(--brown)}.item{display:flex;justify-content:space-between;padding:5px 0}.logout{float:right}.error{color:#9b2b16;margin-top:10px}.success{color:#236b32;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.brand{align-items:flex-start}.logos img{height:64px;width:64px}.logos .mineira{height:60px}}
</style></head><body><main class="wrap"><header class="brand"><div class="logos"><img src="wp-content/uploads/2026/09/clubedopao.png"><img class="mineira" src="wp-content/uploads/2026/09/boutique-mineira-logo.png"></div><a class="back" href="index.html">← Site</a></header><div id="auth" class="card"><div class="hero"><h1>Minha conta</h1><p>Acompanhe seus pedidos e suas entregas.</p></div><div class="tabs"><button id="loginTab" class="active" onclick="mode('login')">Entrar</button><button id="signupTab" onclick="mode('signup')">Criar conta</button></div><div id="loginBox"><div class="grid"><div class="field"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="password" type="password" placeholder="Sua senha"></div></div><button class="btn" style="margin-top:16px" onclick="login()">Entrar</button></div><div id="signupBox" class="hidden"><div class="grid"><div class="field"><label>Nome</label><input id="sName" placeholder="Seu nome"></div><div class="field"><label>E-mail</label><input id="sEmail" type="email" placeholder="seu@email.com"></div><div class="field"><label>Senha</label><input id="sPassword" type="password" placeholder="Mínimo de 6 caracteres"></div></div><button class="btn" style="margin-top:16px" onclick="signup()">Criar minha conta</button></div><div id="msg"></div></div><div id="dashboard" class="hidden"><div class="card"><button class="btn secondary logout" onclick="logout()">Sair</button><h1 id="hello" style="color:var(--brown);margin-top:0">Olá!</h1><div class="hint">Aqui você pode acompanhar suas próximas entregas e pedidos.</div></div><div class="card"><h2 style="color:var(--brown)">📋 Meus pedidos</h2><div id="orders">Carregando...</div></div><div class="card"><h2 style="color:var(--brown)">📅 Minhas entregas</h2><div id="deliveries">Carregando...</div></div></div></main><script src="supabase.js"></script><script>
function mode(m){document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('loginBox').classList.toggle('hidden',m!=='login');document.getElementById('signupBox').classList.toggle('hidden',m!=='signup');document.getElementById('msg').innerHTML=''}
function message(t,ok=false){document.getElementById('msg').className=ok?'success':'error';document.getElementById('msg').textContent=t}
async function login(){try{let s=await signIn(document.getElementById('email').value.trim(),document.getElementById('password').value);await showDashboard(s)}catch(e){message(e.message)}}
async function signup(){try{let name=document.getElementById('sName').value.trim(),email=document.getElementById('sEmail').value.trim(),pass=document.getElementById('sPassword').value;if(!name||!email||pass.length<6){message('Informe nome, e-mail e uma senha com pelo menos 6 caracteres.');return}let s=await signUp(email,pass,name);if(!s){message('Conta criada. Confirme o e-mail recebido e depois entre na sua conta.',true);return}await dbUpsert('clientes',{id:s.user.id,nome:name,telefone:'',email,cep:'',endereco:'',numero:'',bairro:'',cidade:'',complemento:'',ponto_referencia:''},s.access_token,'id');await showDashboard(s)}catch(e){message(e.message)}}
async function logout(){await signOut();location.reload()}
async function showDashboard(session){let u=session?.user||await currentUser();if(!u)return;document.getElementById('auth').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');let token=(await getSession()).access_token;let c=(await dbSelect('clientes',`?id=eq.${encodeURIComponent(u.id)}&select=*&limit=1`,token))[0];document.getElementById('hello').textContent='Olá, '+(c?.nome||u.email||'cliente')+'!';let orders=await dbSelect('pedidos',`?cliente_id=eq.${encodeURIComponent(u.id)}&select=*,planos(nome)&order=created_at.desc`,token);document.getElementById('orders').innerHTML=orders.length?orders.map(o=>`<div class="delivery"><div><strong>${escapeHtml(o.planos?.nome||'Clube do Pão')}</strong> <span class="status">${escapeHtml(o.status)}</span></div><div class="hint">Pedido ${escapeHtml(o.id.slice(0,8).toUpperCase())} • ${new Date(o.created_at).toLocaleDateString('pt-BR')}</div><div style="margin-top:8px"><strong>${moneyBR(o.valor_final)}</strong></div></div>`).join(''):'<p class="hint">Você ainda não possui pedidos.</p>';let ds=await dbSelect('entregas',`?cliente_id=eq.${encodeURIComponent(u.id)}&select=*,itens_entrega(nome_produto,quantidade)&order=data_entrega.asc`,token);document.getElementById('deliveries').innerHTML=ds.length?ds.map(d=>`<div class="delivery"><strong>${new Date(d.data_entrega+'T12:00:00').toLocaleDateString('pt-BR')}</strong> <span class="status">${escapeHtml(d.status)}</span>${(d.itens_entrega||[]).map(i=>`<div class="item"><span>${escapeHtml(i.nome_produto)}</span><b>${i.quantidade}</b></div>`).join('')}</div>`).join(''):'<p class="hint">Nenhuma entrega cadastrada.</p>'}
(async()=>{try{let s=await getSession();if(s)await showDashboard(s)}catch(e){console.error(e)}})();
</script></body></html>
